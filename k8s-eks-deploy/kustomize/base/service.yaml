apiVersion: v1
kind: Service
metadata:
  name: sample-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb   # EKS Auto Mode creates an NLB
  selector: { app: sample-app }
  ports: [{ port: 80, targetPort: 3000 }]
