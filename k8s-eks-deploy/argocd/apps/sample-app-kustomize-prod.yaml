apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-kustomize-prod
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]   # deleting the app deletes its resources (and NLB)
spec:
  project: default
  source:
    repoURL: https://github.com/mubinfshaikh/sandbox.git
    targetRevision: docker-ec2-asg-loadbalancer
    path: k8s-eks-deploy/kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
